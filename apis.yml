aid: fulcrum-bioenergy
name: Fulcrum BioEnergy
description: >-
  Fulcrum BioEnergy, Inc. was a Pleasanton, California waste-to-fuels project developer
  founded in 2007 that converted municipal solid waste into synthetic crude oil for
  refining into sustainable aviation fuel (SAF) and diesel, using a shred-and-sort
  feedstock line feeding a gasifier and a Fischer-Tropsch conversion train. Its first and
  only commercial plant, the Sierra BioFuels Plant in the Tahoe Reno Industrial Center
  outside Reno, Nevada, was designed to take roughly 175,000-219,000 tons of household
  garbage a year from an adjacent feedstock processing facility and began production in
  late 2022. The company raised on the order of a billion dollars in equity, debt and
  government support over its life, including strategic investments and offtake alliances
  with United Airlines, Waste Management, Cathay Pacific Airways, Marubeni and bp, plus a
  US Department of Energy loan guarantee, USDA loan guarantee and Department of Defense
  grants; E. James Macias led it as president and CEO through its build-out years, and it
  had announced follow-on projects including a Gary, Indiana plant and the NorthPoint
  facility in the UK. The Sierra plant stopped operating in mid-May 2024 after persistent
  equipment problems, the company laid off essentially its entire workforce and took its
  website down, and on 2024-09-09 Fulcrum BioEnergy, Fulcrum Sierra Holdings and Fulcrum
  Sierra Finance Co. filed voluntary Chapter 11 petitions in the US Bankruptcy Court for
  the District of Delaware listing more than $456 million owed to over 200 creditors. A
  November 2024 auction sold the biorefinery to Switch, Ltd. for $55 million and the
  adjacent feedstock processing facility to Refuse Inc., a WM subsidiary; the plan of
  liquidation was confirmed in April 2025 and went effective in May 2025. Fulcrum was an
  industrial energy project developer rather than a software company and never published a
  developer program, public API, SDK, webhook surface, or machine-readable specification —
  a Wayback index of its corporate site from 2008 through 2024 turns up no developer,
  reference, or spec path of any kind. Its corporate host fulcrum-bioenergy.com no longer
  resolves to any web server, and the alternate registration fulcrumbioenergy.com is parked
  on the GoDaddy/Afternic aftermarket and listed for sale. This profile is retained as a
  historical record; there is no API surface to enrich.
