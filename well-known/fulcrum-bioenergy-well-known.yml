description: >-
  Negative probe record for Fulcrum BioEnergy. The company filed Chapter 11 in Delaware on
  2024-09-09, sold its assets at auction in November 2024 (Switch, Ltd. took the Sierra
  BioFuels biorefinery; Refuse Inc., a WM subsidiary, took the adjacent feedstock processing
  facility), and its plan of liquidation went effective in May 2025. Its corporate host
  fulcrum-bioenergy.com no longer resolves to any web server — the zone still exists on
  Azure DNS and still carries MX/SPF records, but there is no A or AAAA record, so every
  HTTP request fails to connect. The alternate registration fulcrumbioenergy.com (no hyphen)
  is parked on GoDaddy/Afternic and listed for sale; it answers HTTP 200 with the SAME
  114-byte HTML redirect shell for EVERY path, including every /.well-known/* and every spec
  path. NONE of those 200s is a document. No WellKnown, SecurityTxt, AgentCard, LLMsTxt or
  OpenAPI pointer is emitted from this probe, and none should ever be emitted from it in a
  later round.

